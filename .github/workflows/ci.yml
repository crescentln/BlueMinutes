name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      visual_mode:
        description: Native visual proof mode
        required: true
        default: regression
        type: choice
        options:
          - regression
          - candidate
          - calibration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MEETINGBUDDY_RUN_LIVE_APPLE_MODELS: "0"
      MEETINGBUDDY_RUN_LIVE_APPLE_ANALYSIS: "0"
      MEETINGBUDDY_RUN_LIVE_APPLE_BRIEFING: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Establish standard visual accessibility state
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess differentiateWithoutColor -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          killall -u "$USER" cfprefsd || true
          xcrun swift -e 'import AppKit; let workspace = NSWorkspace.shared; precondition(!workspace.accessibilityDisplayShouldReduceTransparency && !workspace.accessibilityDisplayShouldDifferentiateWithoutColor && !workspace.accessibilityDisplayShouldReduceMotion, "Visual runner accessibility state is not standard.")'

      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve exact dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Build without code signing
        run: swift build -Xswiftc -warnings-as-errors

      - name: Validate public brand metadata and icon
        run: |
          plutil -lint Configuration/MeetingBuddy-Info.plist
          ./script/generate_brand_assets.sh
          git diff --exit-code -- \
            Configuration/Branding/BlueMinutes-AppIcon-1024.png \
            Configuration/Branding/BlueMinutes.icns \
            docs/assets/BlueMinutes-logo.png
          swift test -Xswiftc -warnings-as-errors --filter PublicBrandPresentationTests
          icon_dir="$(mktemp -d "$RUNNER_TEMP/blueminutes-icon.XXXXXX")"
          iconutil -c iconset Configuration/Branding/BlueMinutes.icns \
            -o "$icon_dir/BlueMinutes.iconset"
          test -f "$icon_dir/BlueMinutes.iconset/icon_512x512@2x.png"

      - name: Validate schema and serialization
        run: |
          swift test -Xswiftc -warnings-as-errors --filter CanonicalAndCompatibilityTests
          swift test -Xswiftc -warnings-as-errors --filter RepositoryRoundTripTests

      - name: Validate database migrations
        run: swift test -Xswiftc -warnings-as-errors --filter WorkspaceAndMigrationTests

      - name: Validate recovery
        run: swift test -Xswiftc -warnings-as-errors --filter RecoveryAndTrashTests

      - name: Validate evidence-linked integrations
        run: |
          swift test -Xswiftc -warnings-as-errors --filter TranscriptPipelineIntegrationTests
          swift test -Xswiftc -warnings-as-errors --filter AnalysisPipelineIntegrationTests
          swift test -Xswiftc -warnings-as-errors --filter BriefingPipelineIntegrationTests
          swift test -Xswiftc -warnings-as-errors --filter ProviderContractTests
          swift test -Xswiftc -warnings-as-errors --filter ProviderRoutingContractTests

      - name: Run bounded Golden smoke tests
        run: |
          swift test -Xswiftc -warnings-as-errors --filter GoldenFixtureTests
          swift test -Xswiftc -warnings-as-errors --filter Task010HistoricalComparisonGoldenTests

      - name: Validate isolated historical scale bound
        run: >-
          swift test -Xswiftc -warnings-as-errors
          --filter historicalIndexAndFilteredQueryStayBoundedAtTenThousandPublishedPositions

      - name: Validate isolated native-window contracts
        run: |
          native_window_tests=(
            completeSettingsLayoutSurvivesThemesAndLargerMacText
            visualMatrixProductionInspectorsExposeExactRuntimeAccessibility
            visualLayerSmokeRegionsExposeTheirExactRuntimeControls
            productionTranscriptInspectorOpenAndClosedStatesChangeNativeLayout
            transcriptInspectorToolbarAXActionPreservesFocusAndTogglesProductionBinding
            learnedPreferencesTabHostsRepositoryBackedControlsInsideSettings
            learnedPreferenceRowActionsAreNativeAndAXActivatable
            historyStatesAndCommandsExposeNativeRuntimeAccessibility
            storageLedgerAndTrashActionsExposeNativeRuntimeAccessibility
            storageStateVariantsExposeExactRuntimeAccessibility
            storageStaleAndRetentionBlocksExposeExactRuntimeAXReasons
            itemEditorsExposeDistinctNativeAccessibilityContracts
          )
          for test_name in "${native_window_tests[@]}"; do
            test_log="$(mktemp "$RUNNER_TEMP/blueminutes-native-window-${test_name}.XXXXXX")"
            swift test -Xswiftc -warnings-as-errors \
              --filter "$test_name" \
              2>&1 | tee "$test_log"
            grep -Eq \
              'Test run with [1-9][0-9]* tests? in [1-9][0-9]* suites? passed' \
              "$test_log"
          done

      - name: Validate isolated visual regression contracts
        run: |
          test_log="$(mktemp "$RUNNER_TEMP/blueminutes-visual-contracts.XXXXXX")"
          swift test -Xswiftc -warnings-as-errors \
            --filter BlueMinutesVisualRegressionTests \
            2>&1 | tee "$test_log"
          grep -Eq \
            'Test run with [1-9][0-9]* tests? in [1-9][0-9]* suites? passed' \
            "$test_log"

      - name: Run remaining synthetic-safe suite
        run: |
          test_log="$(mktemp "$RUNNER_TEMP/blueminutes-remaining-tests.XXXXXX")"
          remaining_skip='BlueMinutesVisualRegressionTests|completeSettingsLayoutSurvivesThemesAndLargerMacText|visualMatrixProductionInspectorsExposeExactRuntimeAccessibility|visualLayerSmokeRegionsExposeTheirExactRuntimeControls|productionTranscriptInspectorOpenAndClosedStatesChangeNativeLayout|transcriptInspectorToolbarAXActionPreservesFocusAndTogglesProductionBinding|learnedPreferencesTabHostsRepositoryBackedControlsInsideSettings|learnedPreferenceRowActionsAreNativeAndAXActivatable|historyStatesAndCommandsExposeNativeRuntimeAccessibility|storageLedgerAndTrashActionsExposeNativeRuntimeAccessibility|storageStateVariantsExposeExactRuntimeAccessibility|storageStaleAndRetentionBlocksExposeExactRuntimeAXReasons|itemEditorsExposeDistinctNativeAccessibilityContracts|historicalIndexAndFilteredQueryStayBoundedAtTenThousandPublishedPositions|threeHourRetryAcrossManagerRestartPreservesExactCoverageAndTraceability'
          swift test -Xswiftc -warnings-as-errors \
            --skip "$remaining_skip" \
            2>&1 | tee "$test_log"
          grep -Eq \
            'Test run with [1-9][0-9]* tests? in [1-9][0-9]* suites? passed' \
            "$test_log"

  visual-regression:
    name: Native visual regression
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.visual_mode == 'regression') ||
        (github.event_name == 'pull_request' && github.event.action != 'labeled')
      }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MEETINGBUDDY_VISUAL_MODE: regression
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Establish standard visual accessibility state
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess differentiateWithoutColor -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          killall -u "$USER" cfprefsd || true
          xcrun swift -e 'import AppKit; let workspace = NSWorkspace.shared; precondition(!workspace.accessibilityDisplayShouldReduceTransparency && !workspace.accessibilityDisplayShouldDifferentiateWithoutColor && !workspace.accessibilityDisplayShouldReduceMotion, "Visual runner accessibility state is not standard.")'

      - name: Run pinned native visual regression
        env:
          MEETINGBUDDY_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/blueminutes-visual-failures
        run: ./script/run_visual_regression.sh

      - name: Upload visual evidence
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueminutes-visual-regression-failure
          path: ${{ runner.temp }}/blueminutes-visual-failures
          if-no-files-found: error
          retention-days: 7

  visual-evidence:
    name: Native visual evidence bootstrap
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.visual_mode != 'regression') ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          (github.event.label.name == 'visual-candidate' || github.event.label.name == 'visual-calibration') &&
          (
            (contains(github.event.pull_request.labels.*.name, 'visual-candidate') && !contains(github.event.pull_request.labels.*.name, 'visual-calibration')) ||
            (!contains(github.event.pull_request.labels.*.name, 'visual-candidate') && contains(github.event.pull_request.labels.*.name, 'visual-calibration'))
          )
        )
      }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MEETINGBUDDY_VISUAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_mode || github.event.label.name == 'visual-calibration' && 'calibration' || 'candidate' }}
    steps:
      - name: Check out exact evidence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Establish standard visual accessibility state
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess differentiateWithoutColor -bool false
          defaults write com.apple.universalaccess reduceMotion -bool false
          killall -u "$USER" cfprefsd || true
          xcrun swift -e 'import AppKit; let workspace = NSWorkspace.shared; precondition(!workspace.accessibilityDisplayShouldReduceTransparency && !workspace.accessibilityDisplayShouldDifferentiateWithoutColor && !workspace.accessibilityDisplayShouldReduceMotion, "Visual runner accessibility state is not standard.")'

      - name: Generate pinned native visual evidence
        env:
          MEETINGBUDDY_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/blueminutes-visual-evidence
        run: ./script/run_visual_regression.sh

      - name: Upload visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueminutes-visual-${{ env.MEETINGBUDDY_VISUAL_MODE }}-evidence
          path: ${{ runner.temp }}/blueminutes-visual-evidence
          if-no-files-found: error
          retention-days: 7
